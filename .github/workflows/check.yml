# REVIEW PROBE for PR 130's second round (never merged): test_sql_wake on
# Windows itself, as it is and with each fix removed
name: check
on: [pull_request]
jobs:
  winexe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build -f tools.nix tools -o tools-env
      - run: echo "$PWD/tools-env/bin" >> "$GITHUB_PATH"
      - id: openssl
        uses: actions/cache@v4
        with: { path: build/openssl-win, key: "openssl-win-${{ hashFiles('src/sql/openssl.nix') }}" }
      - if: steps.openssl.outputs.cache-hit == 'true'
        run: find build/openssl-win -type f -exec touch {} +
      - run: >
          sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libstb-dev
          libfreetype-dev libharfbuzz-dev libfontconfig-dev libwayland-dev libxkbcommon-dev
      - run: bash reviews/pr-130-repro/winplants.sh
      - uses: actions/upload-artifact@v4
        with: { name: wake, path: "build/win/wake_*.exe" }
  windows:
    needs: winexe
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with: { name: wake, path: . }
      - shell: bash
        run: |
          for i in 1 2 3 4 5; do for v in ok2 noclose2 flushfirst2 flushfirst; do
            echo "== $v run $i"; timeout 120 ./wake_$v.exe 2>&1 > out.txt 2>&1 && echo "exit 0" || echo "exit $?"; tail -2 out.txt
          done; done
