# A third reference for stepping: Visual Studio's own debugger, on the programs RAD and cdb were recorded on.
# An experiment: it commits what Visual Studio did under traces-vs/; nothing compares with it yet but a person.
name: vs-trace
on:
  push:
    branches: [claude/project-thread-l4spyq]
    paths: ['vs/trace.ps1', 'vs/dte.ps1', '.github/workflows/vs-trace.yml']
permissions:
  contents: write
concurrency:
  group: vs-trace
  cancel-in-progress: true
jobs:
  trace:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Record
        shell: powershell   # Windows PowerShell: the newer one cannot take a running program's automation object
        run: |
          foreach ($f in Get-ChildItem rdi/*.exe -Exclude crash*) {   # an exception stops Visual Studio on a dialog
          ./vs/trace.ps1 $f.FullName (Join-Path $PWD traces-vs) 150; if ($LASTEXITCODE) { exit 1 } }
          # a Visual Studio that did not quit holds the programs open, and the pull below cannot replace one that was recorded anew meanwhile
          Get-Process devenv, VsDebugConsole -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep -Seconds 5
          foreach ($f in Get-ChildItem traces-vs/*.txt) { "===== $($f.Name) (first 25 lines)"; Get-Content $f -TotalCount 25 }
      - name: Commit what Visual Studio did to this branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traces-vs && git diff --cached --quiet || { git commit -qm "What Visual Studio does on the recorded programs [skip ci]" && git pull -q --rebase && git push -q; }
