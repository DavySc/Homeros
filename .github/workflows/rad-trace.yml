# Slice 0: record step traces from the real RAD Debugger on our own subject programs,
# and commit them to this branch as the oracle the prototype engine is compared with.
name: rad-trace
on:
  push:
    branches: [claude/project-thread-l4spyq]
    paths: ['subjects/**', 'oracle/**', '.github/workflows/rad-trace.yml']
permissions:
  contents: write
concurrency:
  group: rad-trace
  cancel-in-progress: true
jobs:
  trace:
    runs-on: windows-latest
    timeout-minutes: 240   # recording took over 86 minutes once the subjects with calls were added, and was cut off at 90
    env:
      RAD_COMMIT: 5b0d5f67a46af5fffa52322e95a116dabf393103
    steps:
      - uses: actions/checkout@v4
      - name: Fetch RAD at the pinned commit
        shell: cmd
        run: |
          git init rad && cd rad && git remote add origin https://github.com/EpicGamesExt/raddebugger
          git fetch --depth 1 origin %RAD_COMMIT% && git checkout FETCH_HEAD && git rev-parse HEAD
      - name: Build raddbg and the subjects
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          pushd rad && call build raddbg release || exit /b 1
          popd
          mkdir bin
          rem /Od with no inlining keeps one line per step; DYNAMICBASE:NO keeps addresses the same on every run
          for %%f in (subjects\*.c subjects\*.cpp) do cl /nologo /Zi /Od /Ob0 /GS- %%f /Fo:bin\ /Fd:bin\%%~nf.pdb /Fe:bin\%%~nf.exe /link /DEBUG /INCREMENTAL:NO /DYNAMICBASE:NO || exit /b 1
          rem the same sources optimised: inlined calls, lines out of order, variables in registers
          for %%f in (subjects\*.c subjects\*.cpp) do cl /nologo /Zi /O2 /GS- %%f /Fo:bin\%%~nf_o2.obj /Fd:bin\%%~nf_o2.pdb /Fe:bin\%%~nf_o2.exe /link /DEBUG /INCREMENTAL:NO /DYNAMICBASE:NO || exit /b 1
          rem "just my code": a call at each function's start, under line numbers 0xf00f00 and 0xfeefee
          cl /nologo /Zi /Od /Ob0 /GS- /JMC subjects\calls.c /Fo:bin\calls_jmc.obj /Fd:bin\calls_jmc.pdb /Fe:bin\calls_jmc.exe /link /DEBUG /INCREMENTAL:NO /DYNAMICBASE:NO || exit /b 1
      - name: Ask RAD for the values and types of the zoo's expressions (the oracle for what a view shows), and commit them at once
        shell: pwsh
        run: |
          foreach ($exe in Get-ChildItem bin/zoo*.exe) { ./oracle/rad-trace.ps1 (Resolve-Path rad/build/raddbg.exe) $exe.FullName (Join-Path $PWD traces) (Join-Path $PWD subjects/zoo.c) }
          foreach ($f in Get-ChildItem traces/*.eval.txt) { "===== $($f.Name)"; Get-Content $f }
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          New-Item -ItemType Directory -Force rdi | Out-Null; Copy-Item bin/zoo*.exe, bin/zoo*.pdb rdi/   # the builds the answers are about
          git add traces/*.eval.txt rdi/zoo*.exe rdi/zoo*.pdb; git diff --cached --quiet; if ($LASTEXITCODE) { git commit -qm "What RAD shows for the zoo's expressions [skip ci]"; git pull -q --rebase; git push -q }
      - name: Record traces
        shell: pwsh
        run: |
          foreach ($exe in Get-ChildItem bin/*.exe) { ./oracle/rad-trace.ps1 (Resolve-Path rad/build/raddbg.exe) $exe.FullName (Join-Path $PWD traces) }
          foreach ($f in Get-ChildItem traces/*.txt) { "===== $($f.Name) (first 40 lines)"; Get-Content $f -TotalCount 40 }
      - name: Convert the subjects' debug info with RAD and dump it (the oracle for our reader and converter)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force rdi | Out-Null
          foreach ($pdb in Get-ChildItem bin/*.pdb) {
            $rdi = "rdi/$($pdb.BaseName).rdi"
            cmd /c "rad\build\raddbg.exe --bin --rdi --deterministic $($pdb.FullName) --out:$rdi 2>&1"
            cmd /c "rad\build\raddbg.exe --bin --dump $rdi --out:$rdi.dump.txt 2>&1"
            Copy-Item "bin/$($pdb.BaseName).exe", $pdb.FullName rdi/
            Get-ChildItem rdi | ForEach-Object { "RDI $($_.Name) $($_.Length)" }
          }
          & "C:\Program Files\Git\usr\bin\gzip.exe" -9 -f (Get-ChildItem rdi/*.dump.txt).FullName
      - name: Commit the traces to this branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traces rdi && git diff --cached --quiet || { git commit -qm "Traces recorded from RAD at ${RAD_COMMIT:0:8} [skip ci]" && git pull -q --rebase && git push -q; }
