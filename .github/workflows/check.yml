# PROBE, never merged (PR 135's review): the GDI calls the wallpaper adds,
# timed on Windows itself.  Reverted in the next commit.
name: check
on:
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - shell: bash
        run: |
          zig cc -target x86_64-windows-gnu -std=c17 -Wall -Wextra -O2 -o gdiprobe.exe reviews/pr-135-repro/gdiprobe.c -lgdi32 -luser32
          ./gdiprobe.exe
          ./gdiprobe.exe
