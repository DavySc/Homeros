# Every merge runs the whole check (CLAUDE.md, "Working in parallel").
name: check
# once per change: pull requests, and main after a merge
on:
  pull_request:
  push:
    branches: [main]
jobs:
  # the check and the plant run in parallel, each on its own runner: one
  # after the other took 54 minutes on main at 8d08829 and passed the limit
  # once a PR added plants (PR 24's review)
  check:
    strategy:
      fail-fast: false
      matrix:
        target: [check, planted]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # C libraries come from the distribution, not nix: nix's need a newer
      # glibc than the system compiler links against (package 12, measured)
      - run: >
          sudo apt-get update && sudo apt-get install -y clang libclang-rt-18-dev pkg-config
          libfreetype-dev libharfbuzz-dev libfontconfig-dev
          libwayland-dev wayland-protocols libxkbcommon-dev weston sway xvfb wtype wl-clipboard grim adwaita-icon-theme
          fonts-jetbrains-mono fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji fonts-dejavu-core
      - run: nix build -f tools.nix tools -o tools-env
      - run: echo "$PWD/tools-env/bin" >> "$GITHUB_PATH"
      - run: why3 config detect
      - run: make ${{ matrix.target }}
