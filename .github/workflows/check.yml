# Every merge runs the whole check (CLAUDE.md, "Working in parallel").
name: check
# once per change: pull requests, and main after a merge
on:
  pull_request:
  push:
    branches: [main]
# a newer push to the same branch makes a running check moot; superseded runs
# filled the account's 20 concurrent jobs for hours on 2026-11-18 (measured:
# 125-156 of 243 runs had a newer run on their branch within 90-40 minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # the check and the plants run in parallel, the plants in shards: one
  # after the other took 54 minutes on main at 8d08829, and the plants alone
  # 42 on PR 18 (reviews of PRs 18 and 24).  The plants run only on the
  # merge train's PR (CLAUDE.md): the account runs 20 jobs at once, and at
  # 18:46 UTC on 2026-11-21 per-PR shards had kept train 15's run waiting
  # 2 h with 1 of 8 shards done
  check:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.head_ref == 'claude/project-thread-clivv8'
                  && '["check", "planted SHARD=0/16", "planted SHARD=1/16", "planted SHARD=2/16", "planted SHARD=3/16",
                       "planted SHARD=4/16", "planted SHARD=5/16", "planted SHARD=6/16", "planted SHARD=7/16",
                       "planted SHARD=8/16", "planted SHARD=9/16", "planted SHARD=10/16", "planted SHARD=11/16",
                       "planted SHARD=12/16", "planted SHARD=13/16", "planted SHARD=14/16", "planted SHARD=15/16"]'
                  || '["check"]') }}
    runs-on: ubuntu-24.04
    # 8 shards of train 14's 1,121 plants took 81 to 90 min, two cut at 90;
    # 12 shards of train 21's 1,467 hit 120 on three: 16 now (expected about 90 min each;
    # 17 jobs plus windows stay under the account's 20); train 24 cut six of
    # the 16 at 120 and the other ten took 108 to 117 min: 180
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # C libraries come from the distribution, not nix: nix's need a newer
      # glibc than the system compiler links against (package 12, measured)
      - run: >
          sudo apt-get update && sudo apt-get install -y clang libclang-rt-18-dev pkg-config libssl-dev
          libfreetype-dev libharfbuzz-dev libstb-dev libfontconfig-dev ripgrep
          libwayland-dev wayland-protocols libxkbcommon-dev weston sway xvfb wtype wl-clipboard grim adwaita-icon-theme
          fonts-jetbrains-mono fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji fonts-dejavu-core
      # the SQL client's tests talk to real servers and fail without them
      # (package 22, agreed): passwords made per run, kept in the
      # environment, never in a file; Postgres with SSL (Debian's snake-oil
      # certificate), as the client always asks for it
      - run: |
          echo "SQL_SA_PASSWORD=Aa1-$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "SQL_PG_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - run: >
          docker run -d -p 1433:1433 -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$SQL_SA_PASSWORD"
          mcr.microsoft.com/mssql/server:2022-latest &&
          docker run -d -p 5432:5432 -e POSTGRES_PASSWORD="$SQL_PG_PASSWORD" postgres:17
          -c ssl=on -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
          -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
      - run: nix build -f tools.nix tools -o tools-env
      - run: echo "$PWD/tools-env/bin" >> "$GITHUB_PATH"
      - run: why3 config detect
      # libghostty-vt (the terminal, src/tools/ghostty.nix) is 5 minutes of
      # zig per target and changes only with its recipe.  The cache keeps the
      # files' times, older than the checkout's, so they are touched or make
      # builds them again; on a miss every job builds both targets, so the
      # job that saves the cache first saves both
      - id: ghostty
        uses: actions/cache@v4
        with: { path: build/ghostty, key: "ghostty-${{ hashFiles('src/tools/ghostty.nix') }}" }
      - if: steps.ghostty.outputs.cache-hit == 'true'
        run: touch build/ghostty/*
      - run: make build/ghostty/windows.lib
      # OpenSSL for Windows (src/sql/openssl.nix, package 22), 6 minutes of
      # zig, cached the same way
      - id: openssl
        uses: actions/cache@v4
        with: { path: build/openssl-win, key: "openssl-win-${{ hashFiles('src/sql/openssl.nix') }}" }
      - if: steps.openssl.outputs.cache-hit == 'true'
        run: find build/openssl-win -type f -exec touch {} +
      - run: make build/openssl-win/lib/libssl.a
      - run: make ${{ matrix.target }}
  # tests that link the whole editor below the window, built here for the
  # windows job (winlink, tools/winpass.sh): their tree-sitter sources and
  # libraries come from nix, which the Windows runner has not
  winexe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build -f tools.nix tools -o tools-env
      - run: echo "$PWD/tools-env/bin" >> "$GITHUB_PATH"
      - id: ghostty
        uses: actions/cache@v4
        with: { path: build/ghostty, key: "ghostty-${{ hashFiles('src/tools/ghostty.nix') }}" }
      - if: steps.ghostty.outputs.cache-hit == 'true'
        run: touch build/ghostty/*
      # OpenSSL for Windows, cached as in check (winlink links src/sql)
      - id: openssl
        uses: actions/cache@v4
        with: { path: build/openssl-win, key: "openssl-win-${{ hashFiles('src/sql/openssl.nix') }}" }
      - if: steps.openssl.outputs.cache-hit == 'true'
        run: find build/openssl-win -type f -exec touch {} +
      # make reads every build.mk's pkg-config before any target
      - run: >
          sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libstb-dev
          libfreetype-dev libharfbuzz-dev libfontconfig-dev libwayland-dev libxkbcommon-dev
      - run: >
          . tools/winpass.sh && winlink build/win/test_git_win.exe tests/test_git_win.c &&
          winlink build/win/test_sql_wake.exe tests/test_sql_wake.c
      - uses: actions/upload-artifact@v4
        with: { name: winexe, path: "build/win/test_git_win.exe\nbuild/win/test_sql_wake.exe" }
  # git's and the loop's Windows halves on Windows itself, for what Wine
  # cannot show (a path's names as stored, a pseudo-console's resize): pull
  # requests only, so it stays short (packages 17 and 10, thread 0's, agreed)
  windows:
    if: github.event_name == 'pull_request'
    needs: winexe
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      # git's Windows half (built by winexe)
      - uses: actions/download-artifact@v4
        with: { name: winexe, path: build/win }
      - run: . tools/winpass.sh && pass 300 build/win/test_git_win.exe
        shell: bash
      # the SQL clients' socket wakes: Windows signals a close once, Wine again (package 22)
      - run: . tools/winpass.sh && pass 120 build/win/test_sql_wake.exe
        shell: bash
      # the pseudo-console (ConPTY), which Wine cannot resize (the terminal's)
      - run: bash src/loop/check.sh
        shell: bash
