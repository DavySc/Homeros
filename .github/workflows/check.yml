# Every merge runs the whole check (CLAUDE.md, "Working in parallel").
name: check
# once per change: pull requests, and main after a merge
on:
  pull_request:
  push:
    branches: [main]
# a newer push to the same branch makes a running check moot; superseded runs
# filled the account's 20 concurrent jobs for hours on 2026-11-18 (measured:
# 125-156 of 243 runs had a newer run on their branch within 90-40 minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # PROBE (PR 138's review; never merged, reverted after the run)
  windows:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - shell: bash
        run: |
          bash src/infoview/check.sh; echo "run gave $?"
      - shell: bash
        run: |
          zig cc -target x86_64-windows-gnu -std=c17 -Wall -Wextra -Iinclude -O1 -g -o build/win/explorer.exe reviews/pr-138-repro/explorer.c src/loop/*.c src/str/str.c -lws2_32 -lshell32 -ladvapi32
          timeout 120 build/win/explorer.exe || echo "explorer probe: status $?"
      - shell: bash
        run: bash reviews/pr-138-repro/winplants.sh
