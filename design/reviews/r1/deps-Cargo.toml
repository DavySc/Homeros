[package]
name = "edeps"
version = "0.1.0"
edition = "2024"

[dependencies]
lsp-types = "0.97.0"
regex = "1.13.1"
serde_json = "1.0.154"
tree-sitter = "0.27.2"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
