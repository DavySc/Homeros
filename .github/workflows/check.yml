# Every merge runs the whole check (CLAUDE.md, "Working in parallel").
name: check
# once per change: pull requests, and main after a merge
on:
  pull_request:
  push:
    branches: [main]
# a newer push to the same branch makes a running check moot; superseded runs
# filled the account's 20 concurrent jobs for hours on 2026-11-18 (measured:
# 125-156 of 243 runs had a newer run on their branch within 90-40 minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  windows:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30   # 15 before the terminal; a cold cache adds its zig build
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      # libghostty-vt for Windows, which test_git_win links (the terminal,
      # src/tools/): no nix here, so zig builds ghostty.nix's revision, once
      # per change of it
      # review of PR 150 (probe, never merged): the PR's test_win and two
      # probes on Windows itself (reviews/pr-150-repro/winprobe.sh)
      - run: bash reviews/pr-150-repro/winprobe.sh
        shell: bash
