# REVIEW PROBE for PR 148 (never merged): test_lsp.exe cross-built on Linux,
# run under Wine there and then on Windows itself.
name: check
on:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: >
          sudo apt-get update && sudo apt-get install -y clang libclang-rt-18-dev pkg-config libssl-dev
          libfreetype-dev libharfbuzz-dev libstb-dev libfontconfig-dev ripgrep
          libwayland-dev wayland-protocols libxkbcommon-dev
      - run: nix build -f tools.nix tools -o tools-env
      - run: echo "$PWD/tools-env/bin" >> "$GITHUB_PATH"
      - id: ghostty
        uses: actions/cache@v4
        with: { path: build/ghostty, key: "ghostty-${{ hashFiles('src/tools/ghostty.nix') }}" }
      - if: steps.ghostty.outputs.cache-hit == 'true'
        run: touch build/ghostty/*
      - run: make build/ghostty/windows.lib
      - run: make wincc
      - run: bash src/lsp/check.sh
      - run: |
          cp build/win/test_lsp.exe test_lsp_good.exe
          python3 - <<'PY'
          p = 'src/lsp/lsp.c'; s = open(p).read()
          a = 'size_t a = ls + lsp_u16_byte(b, n, c), z = ls + lsp_u16_byte(b, n, c + (size_t)v[2]);'
          assert s.count(a) == 1
          open(p, 'w').write(s.replace(a, 'size_t a = ls + c, z = ls + c + (size_t)v[2];'))
          PY
          bash src/lsp/check.sh && echo "PLANT NOT CAUGHT UNDER WINE" || echo "plant caught under Wine"
          cp build/win/test_lsp.exe test_lsp_plant.exe
      - uses: actions/upload-artifact@v4
        with: { name: exes, path: "test_lsp_*.exe" }
  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with: { name: exes }
      - shell: bash
        run: |
          cmd //c ver
          echo "TEMP=$TEMP TMP=$TMP"
          for s in 1 2 3 4 5; do
            SEED=$s ./test_lsp_good.exe > out.txt 2>&1; r=$?
            echo "default temp, SEED=$s: exit $r, last line: $(tail -n 1 out.txt)"
            [ $r = 0 ] || tail -n 15 out.txt
          done
          mkdir -p /c/hometmp
          for s in 1 2 3 4 5; do
            SEED=$s TMP='C:\hometmp' TEMP='C:\hometmp' ./test_lsp_good.exe > out.txt 2>&1; r=$?
            echo "C:/hometmp, SEED=$s: exit $r, last line: $(tail -n 1 out.txt)"
            [ $r = 0 ] || tail -n 15 out.txt
          done
          ls -la /c/hometmp | head -20
          SEED=1 TMP='C:\hometmp' TEMP='C:\hometmp' ./test_lsp_plant.exe > out.txt 2>&1; r=$?
          echo "planted (UTF-16 columns read as bytes): exit $r"; tail -n 5 out.txt
