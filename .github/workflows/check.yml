# Every merge runs the whole check (CLAUDE.md, "Working in parallel").
name: check
# once per change: pull requests, and main after a merge
on:
  pull_request:
  push:
    branches: [main]
# a newer push to the same branch makes a running check moot; superseded runs
# filled the account's 20 concurrent jobs for hours on 2026-11-18 (measured:
# 125-156 of 243 runs had a newer run on their branch within 90-40 minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  winexe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build -f tools.nix tools -o tools-env
      - run: echo "$PWD/tools-env/bin" >> "$GITHUB_PATH"
      - id: ghostty
        uses: actions/cache@v4
        with: { path: build/ghostty, key: "ghostty-${{ hashFiles('src/tools/ghostty.nix') }}" }
      - if: steps.ghostty.outputs.cache-hit == 'true'
        run: touch build/ghostty/*
      # make reads every build.mk's pkg-config before any target
      - run: >
          sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libstb-dev
          libfreetype-dev libharfbuzz-dev libfontconfig-dev libwayland-dev libxkbcommon-dev
      - run: . tools/winpass.sh && winlink build/win/test_git_win.exe tests/test_git_win.c
      - run: . tools/winpass.sh && winlink build/win/test_infoview_win.exe tests/test_infoview_win.c -lws2_32
      - uses: actions/upload-artifact@v4
        with: { name: winexe, path: "build/win/test_git_win.exe\nbuild/win/test_infoview_win.exe" }
  # PROBE (PR 138's re-review; never merged, reverted after the run)
  # success: caught (0: passes); failure: NOT CAUGHT; cancelled: the test hung
  plant:
    if: github.event_name == 'pull_request'
    needs: winexe
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        n: [0, 1, 2, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: actions/download-artifact@v4
        with: { name: winexe, path: build/win }
      - shell: bash
        run: bash reviews/pr-138-repro/winplants.sh ${{ matrix.n }}
