# Process control on real Windows: the stress test that check.sh runs under Wine, natively and longer.
name: win-check
on:
  push:
    branches: [claude/project-thread-l4spyq]
    paths: ['dbg/win/**', 'dbg/target.h', 'tests/spin.c', 'tests/stress_target.c', '.github/workflows/win-check.yml']
jobs:
  stress:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      WINE: env
      WINCC: gcc
      STRESS_ROUNDS: 10000
    steps:
      - uses: actions/checkout@v4
      - name: python3 for check.sh
        run: mkdir -p "$RUNNER_TEMP/shim" && printf '#!/bin/sh\nexec python "$@"\n' > "$RUNNER_TEMP/shim/python3" && echo "$RUNNER_TEMP/shim" >> "$GITHUB_PATH"
      - name: 10,000 random rounds, five seeds, launched and attached
        run: gcc --version && for s in 1 2 3 4 5; do SEED=$s ./check.sh win || exit 1; done
      - name: Every plant is caught
        run: ./check.sh plants win && ./check.sh plants windows
